<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ôn tập Security+ C5-C9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: một cột hẹp, thẻ câu hỏi ở giữa, thanh tiến độ phía trên */
:root{--bg:#f3f5f7;--card:#fff;--fg:#14202b;--mute:#5b6b7a;--line:#d8dee4;--accent:#0b6e8a;--accent-fg:#fff;--ok:#157347;--ok-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe7e5;--sel:#e2f1f6;--font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161c;--card:#18222b;--fg:#e6edf3;--mute:#93a4b3;--line:#2b3946;--accent:#4cc2e0;--accent-fg:#06222b;--ok:#5fd38d;--ok-bg:#12301f;--bad:#ff8a80;--bad-bg:#3a1a18;--sel:#1b3340;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161c;--card:#18222b;--fg:#e6edf3;--mute:#93a4b3;--line:#2b3946;--accent:#4cc2e0;--accent-fg:#06222b;--ok:#5fd38d;--ok-bg:#12301f;--bad:#ff8a80;--bad-bg:#3a1a18;--sel:#1b3340;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.85rem}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:9px 14px;min-height:42px}
button:hover{border-color:var(--accent)}
button:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qn{font-family:var(--mono);font-size:.8rem;color:var(--accent);display:flex;justify-content:space-between;gap:8px}
.q{margin:0;font-weight:500;overflow-wrap:anywhere}
.log{font-family:var(--mono);font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.shot{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#fff;align-self:flex-start}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent);flex:none}
.opt .l{font-family:var(--mono);font-weight:600;color:var(--mute);flex:none;width:1.2em}
.opt span.t{min-width:0;overflow-wrap:anywhere}
.opt.on{background:var(--sel);border-color:var(--accent)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt .tag{margin-left:auto;font-size:.78rem;font-weight:600;flex:none;padding-left:8px}
.opt.ok .tag{color:var(--ok)}.opt.bad .tag{color:var(--bad)}
.res{font-weight:600;padding:10px 12px;border-radius:8px}
.res.ok{background:var(--ok-bg);color:var(--ok)}.res.bad{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .grow{flex:1}
.hint{font-size:.85rem;color:var(--mute)}
.set{display:flex;flex-direction:column;gap:12px}
.set label{display:flex;gap:10px;align-items:center;cursor:pointer}
.set input{accent-color:var(--accent);width:18px;height:18px}
.big{font-size:2.4rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body><main id="app"></main>

: ["RAT", "Worm", "Ransomware", "Bot"], "a": [0], "img": null}, {"n": 5, "q": "A security administrator is trying to eradicate a worm, which is spreading throughout the organization, using an old remote vulnerability in the SMB protocol. The worm uses Nmap to identify target hosts within the company. The administrator wants to implement a solution that will eradicate the current worm and any future attacks that may be using zero-day vulnerabilities. Which of the following would BEST meet the requirements when implemented?", "o": ["Host-based firewall", "Enterprise patch management system", "Network-based intrusion prevention system", "Application blacklisting", "File integrity checking"], "a": [2], "img": null}, {"n": 6, "q": "A security administrator has completed a monthly review of DNS server query logs. The administrator notices continuous name resolution attempts from a large number of internal hosts to a single Internet addressable domain name. The security administrator then correlated those logs with the establishment of persistent TCP connections out to this domain. The connections seem to be carrying on the order of kilobytes of data per week. Which of the following is the MOST likely explanation for this anomaly?", "o": ["An attacker is exfiltrating large amounts of proprietary company data.", "Employees are playing multiplayer computer games.", "A worm is attempting to spread to other hosts via SMB exploits.", "Internal hosts have become members of a botnet."], "a": [3], "img": null}, {"n": 7, "q": "A security administrator has found a hash in the environment known to belong to malware. The administrator then finds this file to be in in the preupdate area of the OS, which indicates it was pushed from the central patch system. File: winx86_adobe_flash_upgrade.exe Hash: 99ac28bede43ab869b853ba62c4ea243 The administrator pulls a report from the patch management system with the following output: Given the above outputs, which of the following MOST likely hap const $=s=>document.querySelector(s);
let LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st={deck:[],i:0,sel:[],checked:false,score:0,wrong:[],done:false};
let cfg=LS.get('cfg',{shuffleQ:true,shuffleO:true});
let wrongAll=LS.get('wrongAll',[]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function build(list){
  let qs=cfg.shuffleQ?shuffle(list):list.slice();
  st.deck=qs.map(q=>{
    let idx=q.o.map((_,k)=>k); if(cfg.shuffleO) idx=shuffle(idx);
    return {q,idx};
  });
  st.i=0;st.sel=[];st.checked=false;st.score=0;st.wrong=[];st.done=false;render();
}
function start(mode){
  if(mode==='wrong'){const l=Q.filter(q=>wrongAll.includes(q.n)); if(!l.length)return; build(l)} else build(Q);
}
function split(q){ // tách các dòng log WARNING khỏi câu hỏi
  const m=q.match(/WARNING- hash mismatch: \S+/g); if(!m) return [q,''];
  let s=q; m.forEach(x=>{s=s.replace(x,'')});
  return [s.replace(/\s+/g,' ').trim(), m.join('\n')];
}
function render(){
  const app=$('#app');
  const head=`<header><div><h1>Ôn tập Security+ (C5–C9)</h1><div class="sub">${Q.length} câu trắc nghiệm · đáp án theo đề cương</div></div><div class="row"><button id="bset">Cài đặt</button></div></header>`;
  if(!st.deck.length){
    app.innerHTML=head+`<div class="card set"><div class="sub">Chọn cách ôn</div>
    <label><input type="checkbox" id="cq" ${cfg.shuffleQ?'checked':''}> Xáo trộn thứ tự câu hỏi</label>
    <label><input type="checkbox" id="co" ${cfg.shuffleO?'checked':''}> Xáo trộn thứ tự đáp án A, B, C…</label>
    <div class="row"><button class="primary grow" id="go">Bắt đầu ôn ${Q.length} câu</button>
    <button class="grow" id="gw" ${wrongAll.length?'':'disabled'}>Ôn lại câu sai (${wrongAll.length})</button></div>
    <div class="hint">Câu sai được lưu trên trình duyệt này để ôn lại sau.</div></div>`;
    $('#cq').onchange=e=>{cfg.shuffleQ=e.target.checked;LS.set('cfg',cfg)};
    $('#co').onchange=e=>{cfg.shuffleO=e.target.checked;LS.set('cfg',cfg)};
    $('#go').onclick=()=>start('all');$('#gw').onclick=()=>start('wrong');
    $('#bset').hidden=true;return;
  }
  $('#app').innerHTML=head;
  if(st.done){
    const n=st.deck.length;
    app.insertAdjacentHTML('beforeend',`<div class="card"><div class="sub">Kết quả</div><div class="big">${st.score}/${n}</div>
    <div class="hint">${st.wrong.length?`Sai ${st.wrong.length} câu: ${st.wrong.map(x=>'Q'+x).join(', ')}`:'Đúng hết, giỏi lắm!'}</div>
    <div class="row"><button class="primary grow" id="again">Làm lại toàn bộ</button>
    <button class="grow" id="rw" ${st.wrong.length?'':'disabled'}>Ôn lại câu vừa sai</button>
    <button class="grow" id="home">Về trang đầu</button></div></div>`);
    $('#again').onclick=()=>start('all');
    $('#rw').onclick=()=>{build(Q.filter(q=>st.wrong.includes(q.n)))};
    $('#home').onclick=()=>{st.deck=[];render()};
    $('#bset').onclick=()=>{st.deck=[];render()};return;
  }
  $('#bset').onclick=()=>{st.deck=[];render()};
  const {q,idx}=st.deck[st.i], n=st.deck.length, multi=q.a.length>1;
  const [stem,log]=split(q.q);
  const ok=st.checked&&sameSet(st.sel,q.a);
  const opts=idx.map((k,pos)=>{
    const on=st.sel.includes(k), isA=q.a.includes(k);
    let cls='opt'+(on&&!st.checked?' on':'');
    let tag='';
    if(st.checked){ if(isA){cls+=' ok';tag='<span class="tag">Đúng</span>'} else if(on){cls+=' bad';tag='<span class="tag">Sai</span>'} }
    return `<label class="${cls}"><input type="${multi?'checkbox':'radio'}" name="o" value="${k}" ${on?'checked':''} ${st.checked?'disabled':''}><span class="l">${String.fromCharCode(65+pos)}</span><span class="t">${esc(q.o[k])}</span>${tag}</label>`;
  }).join('');
  app.insertAdjacentHTML('beforeend',`
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${st.i+(st.checked?1:0)}"><i style="width:${(st.i+(st.checked?1:0))/n*100}%"></i></div>
  <div class="stats"><span>Câu <b>${st.i+1}/${n}</b></span><span>Đúng <b>${st.score}</b></span><span>Sai <b>${st.wrong.length}</b></span></div>
  <div class="card">
    <div class="qn"><span>Câu gốc Q${q.n}</span>${multi?`<span>Chọn ${q.a.length} đáp án</span>`:''}</div>
    <p class="q">${esc(stem)}</p>
    ${log?`<div class="log">${esc(log)}</div>`:''}
    ${q.img?`<img class="shot" src="${q.img}" alt="Hình minh họa câu Q${q.n}">`:''}
    <div class="opts">${opts}</div>
    ${st.checked?`<div class="res ${ok?'ok':'bad'}">${ok?'Chính xác!':'Chưa đúng. Đáp án đúng: '+idx.map((k,p)=>q.a.includes(k)?String.fromCharCode(65+p):'').filter(Boolean).join(', ')}</div>`:''}
    <div class="row">
      ${st.checked?`<button class="primary grow" id="next">${st.i+1<n?'Câu tiếp theo':'Xem kết quả'}</button>`:`<button class="primary grow" id="chk" ${st.sel.length?'':'disabled'}>Kiểm tra</button>`}
    </div>
  </div>`);
  document.querySelectorAll('.opt input').forEach(inp=>inp.onchange=()=>{
    const k=+inp.value;
    if(multi) st.sel=inp.checked?[...st.sel,k]:st.sel.filter(x=>x!==k); else st.sel=[k];
    render();
  });
  const chk=$('#chk'); if(chk) chk.onclick=()=>{
    st.checked=true;
    if(sameSet(st.sel,q.a)){st.score++;wrongAll=wrongAll.filter(x=>x!==q.n)} else {st.wrong.push(q.n);if(!wrongAll.includes(q.n))wrongAll.push(q.n)}
    LS.set('wrongAll',wrongAll);render();
  };
  const nx=$('#next'); if(nx){nx.onclick=()=>{ if(st.i+1<n){st.i++;st.sel=[];st.checked=false}else st.done=true; render(); window.scrollTo(0,0)}; nx.focus({preventScroll:true})}
}
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
render();
</script>
</body></html>
